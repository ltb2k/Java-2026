services:
  postgres:
    image: postgres:16
    container_name: mushroom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mushroom_iot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - mushroom_pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mushroom_iot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mushroom_pgdata:
